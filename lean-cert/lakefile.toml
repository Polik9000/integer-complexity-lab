name = "ICLCert"
version = "0.1.0"
defaultTargets = ["ICLCert"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Unchanged copies of the repository's lean/IntegerComplexity/{Basic,PoC/Selfridge,PoC/Checker,Certificates/M61}.lean
[[lean_lib]]
name = "IntegerComplexity"

# Executable checker (imports only Init); precompiled so native_decide runs native code.
[[lean_lib]]
name = "ICLCertCore"
precompileModules = true

[[lean_lib]]
name = "ICLCert"
